<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PointerEditor 移动版</title>
<meta name="theme-color" content="#2f6fe4">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"OPPO Sans","PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;background:radial-gradient(circle at 18% 8%,rgba(99,168,255,.25),transparent 32%),radial-gradient(circle at 86% 90%,rgba(31,96,213,.25),transparent 38%),linear-gradient(145deg,#08162c,#10274d 54%,#08172f);color:#eaf3ff}
body{display:flex;align-items:center;justify-content:center;padding:24px;min-height:100vh}
body:before{content:"";position:fixed;inset:0;background-image:radial-gradient(rgba(144,188,255,.16) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(to bottom,black,transparent 80%);pointer-events:none}
.wrap{position:relative;z-index:1;width:min(660px,100%);display:flex;flex-direction:column;gap:14px}
.hero{display:flex;align-items:center;gap:13px;margin-bottom:5px}
.hero img{width:54px;height:54px;padding:6px;border-radius:15px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.hero h1{margin:0;font-size:23px;letter-spacing:-.03em}
.hero p{margin:4px 0 0;color:#a9c7ee;font-size:11px}
.card{display:flex;flex-direction:column;gap:10px;padding:19px;border-radius:18px;text-decoration:none;color:inherit;border:1px solid rgba(161,201,255,.22);background:rgba(255,255,255,.07);box-shadow:0 12px 30px rgba(0,0,0,.14);transition:transform .15s ease,border-color .15s ease}
.card:active{transform:scale(.985)}
.card.primary{border-color:rgba(142,191,255,.56);background:linear-gradient(135deg,rgba(74,141,248,.3),rgba(47,111,228,.17))}
.card-head{display:flex;align-items:center;gap:9px}
.card-title{font-size:17px;font-weight:700}
.badge{padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#bcdcff;font-size:9px;border:1px solid rgba(180,216,255,.22)}
.card p{margin:0;color:#a8c4e4;font-size:11px;line-height:1.7}
.card .chips{display:flex;flex-wrap:wrap;gap:5px}
.card .chips span{padding:4px 7px;border-radius:5px;background:rgba(255,255,255,.08);color:#c5dcf6;font-size:9px}
.card .go{align-self:flex-end;margin-top:2px;color:#bcdcff;font-size:11px;font-weight:600}
.foot{text-align:center;color:#6f8fb5;font-size:9px;margin:3px 0 0}
@media (max-width:600px){body{padding:16px}.hero h1{font-size:21px}.card{padding:16px}}
</style>
</head>
