<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PointerE 云服务</title>
<link rel="stylesheet" href="/app.css?v=2">
</head>
<body class="landing">
<header class="landing-header">
  <div class="brand">
    <span class="brand-mark">P</span>
    <span class="brand-name">PointerE</span>
  </div>
</header>
<main class="landing-main">
  <section class="landing-hero">
    <h1>PointerE 云服务</h1>
    <p>PointerE 账号与在线协作节点。账号体系与创客次元相互独立，专为 PointerEditor 多人协作准备。</p>
    <div class="landing-actions">
      <a class="button-link" href="/register">注册 PointerE 账号</a>
    </div>
  </section>
  <section class="landing-grid">
    <article class="landing-card">
      <h2>账号与协作</h2>
      <p>注册并验证邮箱后，在 PointerEditor 打开「云端 → 在线协作」，即可用 PointerE 账号创建或加入房间。</p>
    </article>
    <article class="landing-card">
      <h2>账号独立</h2>
      <p>PointerE 账号只用于协作，与创客次元作品发布互不影响。</p>
    </article>
    <article class="landing-card">
      <h2>加密传输</h2>
      <p>官方节点通过 WSS（TLS）传输协作数据，房间快照只保存在服务器内存中。</p>
    </article>
  </section>
</main>
</body>
</html>
